<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMF Dummy Mail</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#101f35;--line:#1d3552;--text:#eaf3ff;--muted:#8ea5c0;--blue:#3b82f6;--blue2:#2563eb;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b14,#0a1728 55%,#06101d);font-family:Inter,system-ui,Arial;color:var(--text);min-height:100vh}
button,input,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:rgba(13,27,46,.96);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 25px 80px #0008}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:20px}
h1{margin:0 0 7px;font-size:27px}.sub{color:var(--muted);font-size:14px;margin-bottom:25px}
label{display:block;font-size:13px;color:#b9c9dc;margin:14px 0 7px}input,textarea{width:100%;background:#081525;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px;outline:none}input:focus,textarea:focus{border-color:#3b82f6}
.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--blue2);color:white;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:#162943}.btn.danger{background:#991b1b}
.error{color:#ff9a9a;font-size:13px;margin-top:12px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#081423;padding:22px 16px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:30px}.brand .logo{margin:0;width:42px;height:42px;font-size:17px}.brand strong{font-size:16px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.nav button{width:100%;text-align:left;background:transparent;border:0;color:#adc0d6;padding:13px;border-radius:10px;cursor:pointer;margin:3px 0}.nav button.active,.nav button:hover{background:#102a49;color:white}.logout{margin-top:25px;width:100%}
.main{padding:25px;min-width:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.top h2{margin:0;font-size:23px}.mailbox{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.toolbar{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar small{color:var(--muted)}
.list{min-height:300px}.row{display:grid;grid-template-columns:1fr 2fr auto;gap:15px;align-items:center;padding:17px;border-bottom:1px solid #17304b;cursor:pointer}.row:hover{background:#102238}.row:last-child{border-bottom:0}.sender{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subject{font-weight:600}.preview{color:var(--muted);font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{padding:55px 20px;text-align:center;color:var(--muted)}
.compose{padding:20px}.compose textarea{min-height:260px;resize:vertical}.actions{display:flex;gap:10px;margin-top:15px}
.message{padding:22px}.message-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.message-body{white-space:pre-wrap;line-height:1.65;color:#d9e6f5}.back{margin-bottom:14px}
.notice{padding:12px 14px;border-radius:10px;background:#102a49;color:#a9c9ec;font-size:13px;margin-bottom:15px}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:15px}.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row .subject{grid-column:1/-1;grid-row:2}.date{grid-column:2;grid-row:1}}
</style>
</head>
<body>
<section id="login" class="login">
 <div class="login-card">
  <div class="logo">AMF</div><h1>AMF Dummy Mail</h1><div class="sub">Webmail dummy untuk AMF GAMESTORE</div>
  <form id="loginForm">
   <label>Email Admin</label><input id="email" type="email" autocomplete="username" value="admin@amfgamestore.my.id" required>
   <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
   <button class="btn" style="width:100%;margin-top:18px">Masuk</button>
   <div id="loginErr" class="error"></div>
  </form>
 </div>
</section>

<section id="app" class="app hidden">
 <aside class="side">
  <div class="brand"><div class="logo">AMF</div><div><strong>AMF Dummy Mail</strong><span>Mail.tm Webmail</span></div></div>
  <div class="nav">
   <button id="navInbox" class="active" onclick="showInbox()">📥 Kotak Masuk</button>
   <button onclick="showCompose()">✉️ Tulis Email</button>
  </div>
  <button class="btn danger logout" onclick="logout()">Keluar</button>
 </aside>
 <main class="main">
  <div class="top"><div><h2 id="title">Kotak Masuk</h2><div class="mailbox" id="mailbox">Memuat...</div></div><button class="btn" onclick="loadInbox()">↻ Refresh</button></div>
  <div id="content"></div>
 </main>
</section>

<script>
const authKey="amf_dummy_auth";
function authHeader(){return {"Authorization":"Basic "+localStorage.getItem(authKey)}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...authHeader()};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Sesi berakhir");}if(!r.ok)throw Error(d.message||"Terjadi kesalahan");return d}
function logout(){localStorage.removeItem(authKey);location.reload()}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const email=document.getElementById("email").value,password=document.getElementById("password").value;const err=document.getElementById("loginErr");err.textContent="";try{let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok)throw Error(d.message);localStorage.setItem(authKey,btoa(email+":"+password));openApp()}catch(x){err.textContent=x.message}};
async function openApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");try{let c=await api("/api/config");document.getElementById("mailbox").textContent=c.mailbox||"Mailbox belum dikonfigurasi";loadInbox()}catch(e){document.getElementById("mailbox").textContent=e.message}}
if(localStorage.getItem(authKey))openApp();
function showInbox(){document.getElementById("title").textContent="Kotak Masuk";document.getElementById("navInbox").classList.add("active");loadInbox()}
function showCompose(){document.getElementById("title").textContent="Tulis Email";document.getElementById("navInbox").classList.remove("active");document.getElementById("content").innerHTML=`<div class="panel compose"><div class="notice">Email akan dikirim melalui SMTP Mail.tm.</div><label>Tujuan</label><input id="to" placeholder="penerima@email.com"><label>Subjek</label><input id="subject" placeholder="Subjek email"><label>Isi Pesan</label><textarea id="body" placeholder="Tulis pesan..."></textarea><div class="actions"><button class="btn" onclick="sendMail()">Kirim Email</button></div><div id="sendMsg" class="error"></div></div>`}
async function sendMail(){let msg=document.getElementById("sendMsg");msg.textContent="Mengirim...";try{let d=await api("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:document.getElementById("to").value,subject:document.getElementById("subject").value,text:document.getElementById("body").value})});msg.style.color="#86efac";msg.textContent="Email berhasil dikirim.";document.getElementById("to").value="";document.getElementById("subject").value="";document.getElementById("body").value=""}catch(e){msg.style.color="#ff9a9a";msg.textContent=e.message}}
async function loadInbox(){document.getElementById("title").textContent="Kotak Masuk";document.getElementById("content").innerHTML='<div class="panel empty">Memuat email...</div>';try{let d=await api("/api/inbox");let msgs=d["hydra:member"]||d.messages||[];let total=d["hydra:totalItems"]||d.totalItems||msgs.length;let html=`<div class="stats"><div class="stat"><span>Total email</span><b>${total}</b></div><div class="stat"><span>Mailbox</span><b style="font-size:15px">${document.getElementById("mailbox").textContent}</b></div><div class="stat"><span>Status</span><b style="font-size:15px">Terhubung</b></div></div><div class="panel"><div class="toolbar"><small>${msgs.length} email terbaru</small><button class="btn secondary" onclick="loadInbox()">Refresh</button></div><div class="list">`;
if(!msgs.length)html+='<div class="empty">Belum ada email.</div>';msgs.forEach(m=>{html+=`<div class="row" onclick="openMessage('${encodeURIComponent(m.id)}')"><div><div class="sender">${esc(m.from?.name||m.from?.address||"Pengirim")}</div><div class="preview">${esc(m.from?.address||"")}</div></div><div><div class="subject">${esc(m.subject||"(Tanpa subjek)")}</div><div class="preview">${esc(m.intro||"")}</div></div><div class="date">${fmt(m.createdAt)}</div></div>`});html+='</div></div>';document.getElementById("content").innerHTML=html}catch(e){document.getElementById("content").innerHTML=`<div class="panel empty">${esc(e.message)}<br><br>Pastikan MAILTM_EMAIL dan MAILTM_PASSWORD sudah diisi di Vercel.</div>`}}
async function openMessage(id){try{let m=await api("/api/message/"+id);document.getElementById("title").textContent=m.subject||"Email";document.getElementById("content").innerHTML=`<div class="back"><button class="btn secondary" onclick="loadInbox()">← Kembali</button></div><div class="panel message"><div class="message-head"><h2>${esc(m.subject||"(Tanpa subjek)")}</h2><div class="preview">Dari: ${esc(m.from?.address||"")} · ${fmt(m.createdAt)}</div><div class="preview">Kepada: ${esc((m.to||[]).map(x=>x.address).join(", "))}</div></div><div class="message-body">${esc(m.text||strip(m.html)||"")}</div></div>`}catch(e){alert(e.message)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function strip(s){return String(s||"").replace(/<[^>]*>/g," ")}
function fmt(s){if(!s)return"";return new Date(s).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}
</script>
</body>
</html>
