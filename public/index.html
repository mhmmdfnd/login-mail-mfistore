<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoginMail MFIStore</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10233b;--line:#1e3857;--text:#eaf3ff;--muted:#8ea6c4;--blue:#2f8cff;--blue2:#65b1ff;--danger:#ff5d73}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:radial-gradient(circle at 20% 0,#12365d 0,transparent 35%),linear-gradient(135deg,#050b14,#081525 55%,#06101e);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:rgba(13,27,46,.92);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 25px 80px #0008;backdrop-filter:blur(12px)}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#2087ff,#5bb3ff);display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:0 10px 30px #2087ff55}.brand{display:flex;gap:15px;align-items:center;margin-bottom:28px}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
label{display:block;color:#b9cce3;font-size:13px;margin:16px 0 7px}input{width:100%;background:#081525;border:1px solid #23405f;color:var(--text);padding:13px 14px;border-radius:11px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f8cff18}button{width:100%;border:0;border-radius:11px;padding:13px 16px;background:linear-gradient(135deg,#2587ff,#3ba0ff);color:#fff;font-weight:800;cursor:pointer;margin-top:22px}button:hover{filter:brightness(1.08)}.msg{min-height:20px;color:#ff9cac;font-size:13px;margin-top:12px}.hint{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.6}.badge{display:inline-block;padding:4px 8px;border:1px solid #28527b;border-radius:999px;color:#7ec0ff}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">M</div><div><h1>LoginMail</h1><p>MFIStore Email Testing</p></div></div>
  <form id="f"><label>Email Admin</label><input id="email" type="email" autocomplete="username" value="admin@amfgamestore.my.id" required>
  <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
  <button>Masuk sebagai Admin</button><div id="msg" class="msg"></div></form>
  <div class="hint"><span class="badge">Admin</span> Kelola mailbox dari smtp.dev. User biasa masuk melalui link akses yang dibuat Admin dan hanya dapat melihat INBOX.</div>
</div>
<script>
f.onsubmit=async e=>{e.preventDefault();msg.textContent='Memproses...';let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let d=await r.json();if(r.ok)location.href='/admin.html';else msg.textContent=d.error||'Login gagal';};
if(new URLSearchParams(location.search).get('access')==='invalid')msg.textContent='Link akses tidak valid atau sudah kedaluwarsa.';
</script>
</body></html>
