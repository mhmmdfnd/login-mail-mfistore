<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox • LoginMail</title>
<style>
:root{--bg:#060e18;--panel:#0b1728;--panel2:#0d1d31;--line:#1c3551;--text:#eef6ff;--muted:#8ea7c4;--blue:#2d8cff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b13,#081a2d);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:24px}.brand p{margin:5px 0;color:var(--muted);font-size:13px}.btn{padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:#0c1b2e;color:#dff0ff;cursor:pointer}.layout{display:grid;grid-template-columns:360px 1fr;gap:15px}.panel{background:rgba(11,23,40,.95);border:1px solid var(--line);border-radius:17px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list{max-height:calc(100vh - 160px);overflow:auto}.item{padding:15px 17px;border-bottom:1px solid #152c44;cursor:pointer}.item:hover,.item.active{background:#0e2239}.item.unread{border-left:3px solid var(--blue)}.from{font-weight:750;font-size:13px}.subject{margin-top:6px;font-size:14px}.intro{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{color:#708aa7;font-size:11px;margin-top:8px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.message{padding:25px;min-height:500px}.mhead h2{margin:0 0 12px;font-size:22px}.meta{color:var(--muted);font-size:12px;line-height:1.8}.body{margin-top:24px;line-height:1.65;word-break:break-word}.body iframe{max-width:100%;border:0}.plain{white-space:pre-wrap}.attachments{margin-top:25px;padding-top:18px;border-top:1px solid var(--line)}.attachment{display:inline-block;margin:7px 7px 0 0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;color:#b8dcff}.toolbar{display:flex;gap:8px}.loading{padding:20px;color:var(--muted)}
@media(max-width:850px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:42vh}.message{min-height:360px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand"><h1>LoginMail • Inbox</h1><p id="addr">Memuat...</p></div><div class="toolbar"><button class="btn" id="refresh">↻ Refresh</button><button class="btn" id="logout">Keluar</button></div></div>
<div class="layout"><section class="panel"><div class="head"><b>INBOX</b><span id="unread">0</span></div><div id="list" class="list"><div class="loading">Memuat pesan...</div></div></section>
<section class="panel"><div id="message" class="message"><div class="empty">Pilih email untuk membacanya.</div></div></section></div></div>
<script>
const $=x=>document.getElementById(x);let state=[];
async function api(u,o={}){let r=await fetch(u,o);let d=await r.json().catch(()=>({}));if(r.status===401){location.href='/'}if(!r.ok)throw new Error(d.error||'Gagal');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){try{return new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d||''}}
async function load(){try{let d=await api('/api/user/inbox');$('addr').textContent=d.account.address;state=d.messages||[];$('unread').textContent=state.filter(x=>!x.isRead).length;$('list').innerHTML=state.map(m=>`<div class="item ${m.isRead?'':'unread'}" onclick="openMsg('${m.id}',this)"><div class="from">${esc(m.from?.name||m.from?.address||'Unknown')}</div><div class="subject">${esc(m.subject||'(Tanpa subjek)')}</div><div class="intro">${esc(m.intro||m.text||'')}</div><div class="date">${fmt(m.date||m.createdAt)}</div></div>`).join('')||'<div class="empty">Belum ada email masuk.</div>'}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function openMsg(id,el){document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('message').innerHTML='<div class="loading">Membuka email...</div>';try{let m=await api('/api/user/message/'+encodeURIComponent(id));if(!m.isRead){await api('/api/user/message/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({isRead:true})});m.isRead=true;el.classList.remove('unread');$('unread').textContent=Math.max(0,Number($('unread').textContent)-1)}let html='';if(m.html){if(typeof m.html==='string')html=m.html;else if(m.html?.body)html=m.html.body}let ats=(m.attachments||[]).map(a=>`<span class="attachment">📎 ${esc(a.filename)} (${esc(a.contentType||'file')})</span>`).join('');$('message').innerHTML=`<div class="mhead"><h2>${esc(m.subject||'(Tanpa subjek)')}</h2><div class="meta"><b>Dari:</b> ${esc(m.from?.name?m.from.name+' <'+m.from.address+'>':m.from?.address||'')}<br><b>Kepada:</b> ${esc((m.to||[]).map(x=>x.address).join(', '))}<br><b>Tanggal:</b> ${fmt(m.date||m.createdAt)}</div></div><div class="body" id="mailbody"></div>${ats?'<div class="attachments"><b>Lampiran</b><br>'+ats+'</div>':''}`;if(html){let f=document.createElement('iframe');f.setAttribute('sandbox','');f.style.width='100%';f.style.minHeight='430px';f.style.border='0';f.style.background='#fff';f.srcdoc=html;$('mailbody').appendChild(f)}else $('mailbody').innerHTML='<div class="plain">'+esc(m.text||m.intro||'')+'</div>'`}catch(e){$('message').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('refresh').onclick=load;$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
